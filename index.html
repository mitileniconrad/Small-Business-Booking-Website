<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Small Business Booking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="Page-One">

    <!-- Page 1: Ask for the user's name -->
    <section class="screen" id="screen-name"   aria-label=" Enter your name">
      <form class="name-form" id="name-form" novalidate>
        <h1>What should we call you ? </h1>
        <p>Enter your name so we can personalise your bookings.</p>
        <label class="name-field">
          <img class="ico" src="" alt= " User Image">
          <input type="text" id="name-input" placeholder="Your name" maxlength="30" autocomplete="given-name" required>
        </label>
        <p class="field-error" id="name-error" role="alert" hidden>Please enter your name to continue.</p>
        <button type="submit" class="btn-primary"> Continue</button>
      </form>
    </section>

    

  <script src="JS/script.js"></script>
</body>
</html>
