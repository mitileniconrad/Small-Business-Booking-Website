<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Small Business Booking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="Page-One">

    <!-- Page 1: Ask for the user's name -->
    <section class="screen" id="screen-name" aria-label="Enter your name">
      <form class="name-form" id="name-form" novalidate>
        <h1>What should we call you?</h1>
        <p>Enter your name so we can personalise your bookings.</p>
        <label class="name-field">
          <img class="ico" src="assets/icons/grey/user.svg" alt="">
          <input type="text" id="name-input" placeholder="Your name" maxlength="30" autocomplete="given-name" required>
        </label>
        <p class="field-error" id="name-error" role="alert" hidden>Please enter your name to continue.</p>
        <button type="submit" class="btn-primary">Continue</button>
      </form>
    </section>

    <!-- Page 2: Welcome -->
    <section class="screen" id="screen-welcome" aria-label="Welcome">
      <img class="full-img" src="assets/images/welcome.jpg" alt="">
      <div class="welcome-content">
        <h1>Easily book local businesses with us</h1>
        <p>Use our app anytime to find and book services near you.</p>

        <button class="btn-primary" data-goto="screen-home">Get Started</button>
      </div>
    </section>

    <!-- Page 3: Home -->

    <section class="screen" id="screen-home" aria-label="Home">
      <div class="scroll">
        <header class="top-bar">
          <button class="icon-btn" aria-label="Profile"><img class="ico" src="assets/icons/white/user.svg" alt=""></button>
          <button class="icon-btn" aria-label="Search"><img class="ico" src="assets/icons/white/search.svg" alt=""></button>
        </header>

        <h2 class="greeting">Hey, <span class="user-name"></span>! What are you looking for?</h2>

        <label class="search">
          <img class="ico" src="assets/icons/grey/search.svg" alt="">
          <input type="search" id="search-input" placeholder="Search businesses">
        </label>

        <div class="chips" id="category-chips" role="tablist" aria-label="Categories"></div>

        <div class="section-head">
          <h3>Popular Businesses</h3>
        </div>

        <p class="status-msg" id="list-status" role="status">Loading businesses...</p>
        <div class="cards" id="business-list"></div>
        
      </div>

      <nav class="bottom-nav" aria-label="Main">
        <button class="nav-btn active" aria-label="Home" data-icon="home" data-goto="screen-home"><img class="ico" src="assets/icons/blue/home.svg" alt=""></button>
        <button class="nav-btn" aria-label="Favourites" data-icon="heart"><img class="ico" src="assets/icons/grey/heart.svg" alt=""></button>
        <button class="nav-btn" aria-label="Bookings" data-icon="ticket"><img class="ico" src="assets/icons/grey/ticket.svg" alt=""></button>
        <button class="nav-btn" aria-label="Saved" data-icon="bookmark"><img class="ico" src="assets/icons/grey/bookmark.svg" alt=""></button>
        <button class="nav-btn" aria-label="Account" data-icon="user" data-goto="screen-welcome"><img class="ico" src="assets/icons/grey/user.svg" alt=""></button>
      </nav>
    </section>

    <!-- Page 4: Business details -->
    <section class="screen" id="screen-detail" aria-label="Business details">
      <div class="detail-hero">
        <img id="detail-img" alt="">
        <div class="hero-actions">
          <button class="icon-btn" id="back-btn" aria-label="Back"><img class="ico" src="assets/icons/white/chevron-left.svg" alt=""></button>
          <button class="icon-btn" id="fav-btn" aria-label="Save" aria-pressed="false"><img class="ico" id="fav-icon" src="assets/icons/white/heart.svg" alt=""></button>
        </div>
      </div>

      <div class="detail-body">
        <div>
          <h2 id="detail-name"></h2>
          <span class="tag" id="detail-category"></span>
        </div>

        <h3>About</h3>
        <p class="detail-desc" id="detail-desc"></p>

        <button class="btn-primary" id="book-btn">Book Now</button>
      </div>
    </section>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="JS/script.js"></script>
</body>
</html>
